[project]
name = "hoofprints"
version = "0.1.0"
description = "競馬ドラマサービス（agentkit上のアプリ）"
requires-python = ">=3.12"
dependencies = [
    "agentkit",
]

[project.scripts]
hoofprints = "hoofprints.cli:main"

[tool.uv.sources]
agentkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoofprints"]

[dependency-groups]
dev = ["pytest>=8.3"]
